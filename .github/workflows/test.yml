name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - name: Verify no-paid-path exit code
        run: |
          set +e
          python3 preflight.py examples/overnight-portugal.json --fail-if-no-payment-path
          code=$?
          test "$code" -eq 2
